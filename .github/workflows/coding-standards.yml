
name: Java Coding Standards

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check-java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Java
        run: |
          mkdir -p out
          javac -d out src/Main.java

      - name: Run Checkstyle
        run: |
          curl -fsSL -o checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.2/checkstyle-10.21.2-all.jar
          java -jar checkstyle.jar -c checkstyle.xml src/Main.java
